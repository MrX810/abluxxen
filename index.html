<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abluxxen</title>
    <style>
        /* ----- Globale Grundlagen ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a2a3a, #0f1a24);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        #app {
            width: 1300px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 24px 28px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ----- Kopf / Settings ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-weight: 300;
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #f7d875, #f0b34b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .settings-panel {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 20px 40px;
        }
        .settings-panel.open {
            display: flex;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .setting-group label {
            font-size: 0.85rem;
            opacity: 0.7;
            font-weight: 300;
        }
        .setting-group select,
        .setting-group input[type="number"] {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            width: 140px;
        }
        .setting-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #f0b34b;
            cursor: pointer;
        }

        /* ----- Spielbereich ----- */
        .game-area {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ---- Tisch (Mitte) ---- */
        .table {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 16px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 30px;
            padding: 20px 16px;
            min-height: 200px;
        }
        .player-area {
            flex: 1 1 180px;
            min-width: 150px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 12px 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(2px);
        }
        .player-area .name {
            font-weight: 300;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 8px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }
        .player-area .name .highlight {
            color: #f7d875;
            font-weight: 400;
        }
        .player-area .hand-count {
            font-size: 0.8rem;
            opacity: 0.5;
            text-align: center;
            margin-top: 6px;
        }
        .player-area .display-area {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 4px;
            min-height: 60px;
        }
        .pile {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 4px 6px;
            min-height: 40px;
        }
        .pile .card {
            font-size: 0.8rem;
            width: 32px;
            height: 44px;
            line-height: 44px;
            text-align: center;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 600;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .card-joker {
            background: radial-gradient(circle at 30% 30%, #ffd966, #d4a017) !important;
            border-color: #f7d875 !important;
            color: #3d2b00 !important;
        }
        .card-value-1 { background: #4a7c8a; }
        .card-value-2 { background: #4a8a6a; }
        .card-value-3 { background: #6a8a4a; }
        .card-value-4 { background: #8a7a4a; }
        .card-value-5 { background: #9a6a4a; }
        .card-value-6 { background: #9a5a4a; }
        .card-value-7 { background: #9a4a5a; }
        .card-value-8 { background: #8a4a6a; }
        .card-value-9 { background: #7a4a8a; }
        .card-value-10 { background: #5a4a8a; }
        .card-value-11 { background: #4a5a8a; }
        .card-value-12 { background: #4a6a8a; }
        .card-value-13 { background: #4a7a7a; }
        .card-value-14 { background: #b8860b; }

        .pile-label {
            font-size: 0.65rem;
            opacity: 0.5;
            margin-top: 2px;
        }

        /* ---- Handkarten (eigene) ---- */
        .my-hand {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 16px 20px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .my-hand .hand-title {
            font-weight: 300;
            font-size: 0.9rem;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        .hand-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .hand-cards .card {
            width: 48px;
            height: 68px;
            line-height: 68px;
            font-size: 1.2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
        .hand-cards .card:hover {
            transform: translateY(-6px);
            border-color: #f7d875;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
        }
        .hand-cards .card.selected {
            border-color: #f7d875;
            box-shadow: 0 0 0 3px #f7d87588;
            transform: translateY(-8px);
        }

        /* ---- Vorrat / Ablage / Stapel ---- */
        .supply-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 30px;
            padding: 14px 20px;
            margin-top: 10px;
            align-items: center;
        }
        .supply-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .supply-group .label {
            font-size: 0.7rem;
            opacity: 0.4;
            font-weight: 300;
        }
        .supply-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
        }
        .supply-cards .card {
            width: 36px;
            height: 50px;
            line-height: 50px;
            font-size: 0.9rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: 600;
            color: #fff;
        }
        .supply-cards .card.back {
            background: repeating-linear-gradient(45deg, #2a3a4a, #2a3a4a 8px, #1f2f3f 8px, #1f2f3f 16px);
            border-color: #4a5a6a;
        }

        /* ---- Interaktions-Buttons & Meldungen ---- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0 8px;
            justify-content: center;
        }
        .actions button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
        }
        .actions button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: #f7d875;
            transform: scale(1.02);
        }
        .actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .actions button.primary {
            background: #f7d875;
            border-color: #f7d875;
            color: #1a2a3a;
        }
        .actions button.primary:hover:not(:disabled) {
            background: #fae09a;
        }
        .message-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 40px;
            padding: 12px 24px;
            text-align: center;
            font-weight: 300;
            font-size: 1rem;
            border-left: 4px solid #f7d875;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
        }

        /* ---- Modal / Overlay für Entscheidungen ---- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #1f2f3f;
            border-radius: 40px;
            padding: 30px 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-box h3 {
            font-weight: 300;
            font-size: 1.4rem;
            margin-bottom: 16px;
            text-align: center;
            color: #f7d875;
        }
        .modal-box p {
            opacity: 0.8;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-box .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .modal-box .modal-actions button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            min-width: 120px;
        }
        .modal-box .modal-actions button:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .modal-box .modal-actions button.primary {
            background: #f7d875;
            border-color: #f7d875;
            color: #1a2a3a;
        }
        .modal-box .modal-actions button.primary:hover {
            background: #fae09a;
        }

        /* ---- Responsive ---- */
        @media (max-width: 800px) {
            #app { padding: 16px; }
            .header h1 { font-size: 1.8rem; }
            .player-area { flex: 1 1 140px; min-width: 120px; }
            .hand-cards .card { width: 40px; height: 56px; line-height: 56px; font-size: 1rem; }
            .supply-cards .card { width: 30px; height: 42px; line-height: 42px; font-size: 0.8rem; }
            .modal-box { padding: 24px; }
        }
        @media (max-width: 500px) {
            .player-area { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Kopf -->
        <div class="header">
            <h1>♠ Abluxxen</h1>
            <button class="settings-btn" id="settingsToggle">⚙️ Einstellungen</button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="setting-group">
                <label>Anzahl Bots</label>
                <select id="botCountSelect">
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Bot‑Schwierigkeit</label>
                <select id="botDifficulty">
                    <option value="easy">Leicht</option>
                    <option value="medium" selected>Mittel</option>
                    <option value="hard">Schwer</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Startspieler zufällig</label>
                <input type="checkbox" id="randomStarter" checked>
            </div>
            <div class="setting-group">
                <label>Ablage mischen (neuer Stapel)</label>
                <input type="checkbox" id="reshuffleDiscard" checked>
            </div>
            <div class="setting-group" style="justify-content: flex-end;">
                <button class="settings-btn" id="applySettings" style="background:#f7d875; color:#1a2a3a; border:none;">Übernehmen & Neustart</button>
            </div>
        </div>

        <!-- Spiel -->
        <div class="game-area">
            <!-- Tisch (Spielerbereiche) -->
            <div class="table" id="tableContainer"></div>

            <!-- Eigene Hand -->
            <div class="my-hand" id="myHandArea">
                <div class="hand-title">Deine Hand (<span id="handCount">0</span> Karten)</div>
                <div class="hand-cards" id="handCards"></div>
                <div class="actions" id="actionButtons">
                    <button id="playBtn" disabled class="primary">Auslegen</button>
                    <button id="endTurnBtn" disabled>Zug beenden</button>
                </div>
                <div class="message-box" id="messageBox">Willkommen! Starte eine neue Runde.</div>
            </div>

            <!-- Vorrat / Ablage / Stapel -->
            <div class="supply-area">
                <div class="supply-group">
                    <span class="label">Vorrat</span>
                    <div class="supply-cards" id="supplyCards"></div>
                </div>
                <div class="supply-group">
                    <span class="label">Ablage</span>
                    <div class="supply-cards" id="discardPile"></div>
                </div>
                <div class="supply-group">
                    <span class="label">Nachziehstapel</span>
                    <div class="supply-cards" id="drawPile"><div class="card back">🂠</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal für Entscheidungen -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <h3 id="modalTitle">Entscheidung</h3>
            <p id="modalText">Wähle eine Option.</p>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ABLUXxEN – Vollständige Spiellogik
        // ============================================================

        // ---------- Hilfsfunktionen ----------
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createDeck() {
            const deck = [];
            for (let v = 1; v <= 13; v++) {
                for (let i = 0; i < 8; i++) deck.push(v);
            }
            for (let i = 0; i < 5; i++) deck.push(14); // Joker
            return shuffle(deck);
        }

        function isJoker(val) { return val === 14; }

        function cardDisplay(val) {
            if (val === 14) return '★';
            return val;
        }

        function cardClass(val) {
            if (val === 14) return 'card-joker';
            return 'card-value-' + val;
        }

        // ---------- Spielzustand ----------
        let state = {
            players: [],          // [{name, hand:[], display:[], isBot}]
            currentPlayerIndex: 0,
            supply: [],           // offene Karten (max 6)
            drawPile: [],
            discardPile: [],
            gameOver: false,
            phase: 'idle',        // 'idle', 'selecting', 'abluxxen', 'drawChoice'
            // temporär für Zug
            playedCards: [],      // Werte der soeben ausgelegten Karten
            playedValue: null,
            playedCount: 0,
            abluxxTargets: [],    // Liste von {targetIndex, cards} für aktuelle Abluxx-Runde
            abluxxIndex: 0,
            pendingDrawFor: null, // Spielerindex der nachziehen muss
            pendingDrawCount: 0,
            pendingDrawSource: null, // 'supply' oder 'draw'
            waitingForModal: false,
        };

        // Settings
        let settings = {
            botCount: 3,
            difficulty: 'medium', // 'easy','medium','hard'
            randomStarter: true,
            reshuffleDiscard: true,
        };

        // DOM-Referenzen
        const tableContainer = document.getElementById('tableContainer');
        const handCardsEl = document.getElementById('handCards');
        const handCountEl = document.getElementById('handCount');
        const supplyCardsEl = document.getElementById('supplyCards');
        const discardPileEl = document.getElementById('discardPile');
        const drawPileEl = document.getElementById('drawPile');
        const messageBox = document.getElementById('messageBox');
        const playBtn = document.getElementById('playBtn');
        const endTurnBtn = document.getElementById('endTurnBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const modalActions = document.getElementById('modalActions');

        // ---------- Initialisierung ----------
        function initGame() {
            // Settings auslesen
            settings.botCount = parseInt(document.getElementById('botCountSelect').value);
            settings.difficulty = document.getElementById('botDifficulty').value;
            settings.randomStarter = document.getElementById('randomStarter').checked;
            settings.reshuffleDiscard = document.getElementById('reshuffleDiscard').checked;

            const deck = createDeck();
            const totalPlayers = 1 + settings.botCount;
            const cardsPerPlayer = 13;
            const needed = totalPlayers * cardsPerPlayer;
            if (deck.length < needed) {
                alert('Nicht genug Karten für diese Spielerzahl!');
                return;
            }

            // Spieler anlegen
            state.players = [];
            // Mensch (Index 0)
            state.players.push({ name: 'Du', hand: [], display: [], isBot: false });
            for (let i = 1; i <= settings.botCount; i++) {
                state.players.push({ name: 'Bot ' + i, hand: [], display: [], isBot: true });
            }

            // Karten verteilen
            for (let p of state.players) {
                p.hand = deck.splice(0, cardsPerPlayer);
            }

            // Vorrat: 6 Karten vom Stapel
            state.supply = deck.splice(0, 6);
            state.drawPile = deck;
            state.discardPile = [];
            state.gameOver = false;
            state.phase = 'idle';
            state.abluxxTargets = [];
            state.abluxxIndex = 0;
            state.pendingDrawFor = null;
            state.waitingForModal = false;

            // Startspieler
            if (settings.randomStarter) {
                state.currentPlayerIndex = Math.floor(Math.random() * totalPlayers);
            } else {
                state.currentPlayerIndex = 0;
            }

            // UI aktualisieren
            renderAll();
            setMessage('Neues Spiel gestartet! ' + state.players[state.currentPlayerIndex].name + ' beginnt.');
            if (state.currentPlayerIndex === 0) {
                startHumanTurn();
            } else {
                startBotTurn();
            }
        }

        // ---------- Rendering ----------
        function renderAll() {
            renderTable();
            renderHand();
            renderSupply();
            renderDiscardAndDraw();
            updateButtons();
        }

        function renderTable() {
            tableContainer.innerHTML = '';
            state.players.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'player-area';
                const isCurrent = (idx === state.currentPlayerIndex && !state.gameOver);
                const nameSpan = document.createElement('div');
                nameSpan.className = 'name';
                nameSpan.innerHTML = p.name + (isCurrent ? ' <span class="highlight">●</span>' : '');
                div.appendChild(nameSpan);

                const displayDiv = document.createElement('div');
                displayDiv.className = 'display-area';
                // Ebenen (display) von unten nach oben anzeigen
                if (p.display.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.opacity = '0.2';
                    empty.style.fontSize = '0.8rem';
                    empty.textContent = '—';
                    displayDiv.appendChild(empty);
                } else {
                    // Von oben nach unten, aber wir wollen die oberste zuletzt angezeigt (oben)
                    // Also durchgehen von unten (Index 0) bis oben (letztes)
                    for (let i = 0; i < p.display.length; i++) {
                        const pile = p.display[i];
                        const pileDiv = document.createElement('div');
                        pileDiv.className = 'pile';
                        // Karten in dieser Ebene anzeigen
                        const cards = pile.cards; // array von Werten
                        cards.forEach(val => {
                            const card = document.createElement('div');
                            card.className = 'card ' + cardClass(val);
                            card.textContent = cardDisplay(val);
                            pileDiv.appendChild(card);
                        });
                        displayDiv.appendChild(pileDiv);
                    }
                }
                div.appendChild(displayDiv);

                const handCount = document.createElement('div');
                handCount.className = 'hand-count';
                handCount.textContent = 'Hand: ' + p.hand.length + ' Karten';
                div.appendChild(handCount);

                tableContainer.appendChild(div);
            });
        }

        function renderHand() {
            const player = state.players[0];
            handCardsEl.innerHTML = '';
            if (!player) return;
            player.hand.forEach((val, idx) => {
                const card = document.createElement('div');
                card.className = 'card ' + cardClass(val);
                card.textContent = cardDisplay(val);
                card.dataset.index = idx;
                card.addEventListener('click', () => onHandCardClick(idx));
                handCardsEl.appendChild(card);
            });
            handCountEl.textContent = player.hand.length;
        }

        function renderSupply() {
            supplyCardsEl.innerHTML = '';
            state.supply.forEach(val => {
                const card = document.createElement('div');
                card.className = 'card ' + cardClass(val);
                card.textContent = cardDisplay(val);
                // Klick für Nachziehen (wird im entsprechenden Modus aktiviert)
                card.style.cursor = 'pointer';
                card.addEventListener('click', () => onSupplyClick(val));
                supplyCardsEl.appendChild(card);
            });
        }

        function renderDiscardAndDraw() {
            // Ablage: nur die oberste Karte anzeigen, aber wir zeigen alle (klein)
            discardPileEl.innerHTML = '';
            if (state.discardPile.length > 0) {
                // Zeige die letzten 3 Karten
                const show = state.discardPile.slice(-3);
                show.forEach(val => {
                    const card = document.createElement('div');
                    card.className = 'card ' + cardClass(val);
                    card.textContent = cardDisplay(val);
                    card.style.width = '30px';
                    card.style.height = '40px';
                    card.style.lineHeight = '40px';
                    card.style.fontSize = '0.7rem';
                    discardPileEl.appendChild(card);
                });
            } else {
                const span = document.createElement('span');
                span.style.opacity = '0.2';
                span.textContent = 'leer';
                discardPileEl.appendChild(span);
            }

            // Nachziehstapel: Anzahl anzeigen
            drawPileEl.innerHTML = '';
            if (state.drawPile.length > 0) {
                const count = state.drawPile.length;
                const card = document.createElement('div');
                card.className = 'card back';
                card.textContent = count;
                card.style.width = '36px';
                card.style.height = '50px';
                card.style.lineHeight = '50px';
                card.style.fontSize = '0.9rem';
                card.style.background = 'repeating-linear-gradient(45deg, #2a3a4a, #2a3a4a 8px, #1f2f3f 8px, #1f2f3f 16px)';
                drawPileEl.appendChild(card);
            } else {
                const span = document.createElement('span');
                span.style.opacity = '0.2';
                span.textContent = 'leer';
                drawPileEl.appendChild(span);
            }
        }

        function updateButtons() {
            const player = state.players[0];
            if (!player) return;
            const isMyTurn = (state.currentPlayerIndex === 0 && !state.gameOver);
            const canPlay = isMyTurn && state.phase === 'idle' && player.hand.length > 0;
            playBtn.disabled = !canPlay;
            endTurnBtn.disabled = !isMyTurn || state.phase !== 'idle';
        }

        function setMessage(msg) {
            messageBox.textContent = msg;
        }

        // ---------- Menschliche Interaktion ----------
        let selectedHandIndex = null;

        function onHandCardClick(index) {
            if (state.currentPlayerIndex !== 0 || state.phase !== 'idle' || state.gameOver) return;
            const player = state.players[0];
            if (index >= player.hand.length) return;
            // Auswahl umschalten
            if (selectedHandIndex === index) {
                selectedHandIndex = null;
            } else {
                selectedHandIndex = index;
            }
            // Markierung in UI
            const cards = handCardsEl.querySelectorAll('.card');
            cards.forEach((el, i) => {
                el.classList.toggle('selected', i === selectedHandIndex);
            });
            // Wenn ausgewählt, Play-Button aktivieren
            playBtn.disabled = (selectedHandIndex === null);
            if (selectedHandIndex !== null) {
                const val = player.hand[selectedHandIndex];
                setMessage('Ausgewählt: ' + cardDisplay(val) + ' – klicke auf "Auslegen"');
            } else {
                setMessage('Wähle eine Karte aus deiner Hand.');
            }
        }

        // Auslegen (Mensch)
        function handlePlay() {
            if (state.currentPlayerIndex !== 0 || state.phase !== 'idle' || state.gameOver) return;
            const player = state.players[0];
            if (selectedHandIndex === null || selectedHandIndex >= player.hand.length) return;
            const value = player.hand[selectedHandIndex];
            // Alle Karten dieses Werts aus der Hand nehmen
            const cardsToPlay = player.hand.filter(v => v === value);
            if (cardsToPlay.length === 0) return;

            // Aus Hand entfernen
            player.hand = player.hand.filter(v => v !== value);
            // In Auslage legen (neue Ebene)
            player.display.push({ value: value, cards: cardsToPlay });

            state.playedCards = cardsToPlay;
            state.playedValue = value;
            state.playedCount = cardsToPlay.length;
            state.phase = 'abluxxen';

            // Abluxxen starten: alle anderen Spieler im Uhrzeigersinn ab dem linken Nachbarn
            const total = state.players.length;
            const startIdx = (state.currentPlayerIndex + 1) % total;
            const targets = [];
            for (let i = 0; i < total - 1; i++) {
                const idx = (startIdx + i) % total;
                if (idx === state.currentPlayerIndex) continue;
                targets.push(idx);
            }
            state.abluxxTargets = targets;
            state.abluxxIndex = 0;

            selectedHandIndex = null;
            renderAll();
            // Abluxxen abarbeiten
            performAbluxxen();
        }

        // ---------- Abluxxen-Logik ----------
        function performAbluxxen() {
            if (state.abluxxIndex >= state.abluxxTargets.length) {
                // Alle abgearbeitet
                finishTurn();
                return;
            }

            const targetIdx = state.abluxxTargets[state.abluxxIndex];
            const target = state.players[targetIdx];
            const current = state.players[state.currentPlayerIndex];

            // Prüfen, ob target eine oberste Ebene hat
            if (target.display.length === 0) {
                state.abluxxIndex++;
                performAbluxxen();
                return;
            }
            const topPile = target.display[target.display.length - 1];
            const topCount = topPile.cards.length;
            const topValue = topPile.value;

            // Bedingungen: gleiche Anzahl UND höherer Wert
            if (state.playedCount === topCount && state.playedValue > topValue) {
                // Abluxxen möglich!
                // Aktueller Spieler muss entscheiden, ob er die Karten nimmt oder nicht
                if (state.currentPlayerIndex === 0) {
                    // Mensch entscheidet
                    showAbluxxModal(targetIdx);
                } else {
                    // Bot entscheidet
                    const take = botDecideTakeAbluxxed(targetIdx, state.playedCards);
                    executeAbluxxDecision(targetIdx, take);
                }
            } else {
                state.abluxxIndex++;
                performAbluxxen();
            }
        }

        function showAbluxxModal(targetIdx) {
            const target = state.players[targetIdx];
            const topPile = target.display[target.display.length - 1];
            const cards = topPile.cards;
            const displayStr = cards.map(v => cardDisplay(v)).join(' ');

            modalTitle.textContent = 'Abluxxen bei ' + target.name;
            modalText.innerHTML = `
                Du hast <strong>${state.playedCount}</strong> Karten (Wert ${state.playedValue}) ausgelegt.<br>
                ${target.name} hat oben: <strong>${displayStr}</strong> (Anzahl ${cards.length}, Wert ${topPile.value}).<br>
                Möchtest du diese Karten auf deine Hand nehmen?
            `;
            modalActions.innerHTML = '';
            const btnTake = document.createElement('button');
            btnTake.className = 'primary';
            btnTake.textContent = 'Ja, nehmen';
            btnTake.addEventListener('click', () => {
                closeModal();
                executeAbluxxDecision(targetIdx, true);
            });
            const btnNotTake = document.createElement('button');
            btnNotTake.textContent = 'Nein, nicht nehmen';
            btnNotTake.addEventListener('click', () => {
                closeModal();
                executeAbluxxDecision(targetIdx, false);
            });
            modalActions.appendChild(btnTake);
            modalActions.appendChild(btnNotTake);
            modalOverlay.classList.add('open');
            state.waitingForModal = true;
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            state.waitingForModal = false;
        }

        function executeAbluxxDecision(targetIdx, take) {
            const target = state.players[targetIdx];
            const current = state.players[state.currentPlayerIndex];
            const topPile = target.display.pop(); // entfernen

            if (take) {
                // Nehmen: Karten auf Hand des aktuellen Spielers
                current.hand.push(...topPile.cards);
                // Gegner zieht genauso viele Karten nach
                const count = topPile.cards.length;
                drawCardsForPlayer(targetIdx, count);
                setMessage(target.name + ' zieht ' + count + ' Karten nach.');
            } else {
                // Nicht nehmen: Gegner entscheidet, ob zurücknehmen oder abwerfen
                // Wenn Gegner Bot, Entscheidung treffen
                if (target.isBot) {
                    const takeBack = botDecideTakeBack(targetIdx, topPile.cards);
                    if (takeBack) {
                        target.hand.push(...topPile.cards);
                        setMessage(target.name + ' nimmt die Karten zurück.');
                    } else {
                        target.discardPile = target.discardPile || []; // falls nicht initialisiert
                        target.discardPile.push(...topPile.cards);
                        // Nachziehen
                        drawCardsForPlayer(targetIdx, topPile.cards.length);
                        setMessage(target.name + ' wirft ab und zieht nach.');
                    }
                } else {
                    // Menschlicher Gegner (kann nur bei Multiplayer-Mensch vorkommen, hier aber nicht)
                    // Für Einfachheit: Immer zurücknehmen
                    target.hand.push(...topPile.cards);
                    setMessage(target.name + ' nimmt die Karten zurück.');
                }
            }

            // Nächsten Abluxx-Schritt
            state.abluxxIndex++;
            renderAll();
            // Fortsetzen
            performAbluxxen();
        }

        // Nachziehen für einen Spieler (count Karten)
        function drawCardsForPlayer(playerIdx, count) {
            const player = state.players[playerIdx];
            for (let i = 0; i < count; i++) {
                // Entscheidung: aus Vorrat oder Stapel? Für Bot wird es in der Schleife entschieden.
                if (player.isBot) {
                    const fromSupply = botDecideDrawSource(playerIdx);
                    if (fromSupply && state.supply.length > 0) {
                        player.hand.push(state.supply.pop());
                    } else if (state.drawPile.length > 0) {
                        player.hand.push(state.drawPile.pop());
                    } else if (settings.reshuffleDiscard && state.discardPile.length > 0) {
                        // Ablage mischen und als neuen Stapel
                        state.drawPile = shuffle(state.discardPile);
                        state.discardPile = [];
                        player.hand.push(state.drawPile.pop());
                    } else {
                        // Keine Karten mehr – aber wir müssen weitermachen
                        break;
                    }
                } else {
                    // Mensch – hier würden wir interaktiv nachziehen lassen, aber in dieser Implementierung
                    // zieht der Mensch nur als Reaktion auf Abluxx? Eigentlich zieht nur der Gegner.
                    // Da der Mensch nur Spieler 0 ist und nie abgeluxxt wird (gegen Bots), brauchen wir das nicht.
                    // Aber für Vollständigkeit: Falls Mensch abgeluxxt wird, würden wir Modal anzeigen.
                    // Für unseren Fall ignorieren wir das.
                    if (state.drawPile.length > 0) {
                        player.hand.push(state.drawPile.pop());
                    } else if (settings.reshuffleDiscard && state.discardPile.length > 0) {
                        state.drawPile = shuffle(state.discardPile);
                        state.discardPile = [];
                        player.hand.push(state.drawPile.pop());
                    }
                }
            }
            // Nach jedem Nachziehen: Vorrat auffüllen (erst nachdem alle nachgezogen haben)
            // Aber das machen wir erst am Ende des Zuges, nicht hier.
            // Allerdings: Die Regel sagt: "Erst nachdem du komplett nachgezogen hast, füllst du den Vorrat wieder auf sechs Karten auf."
            // Das bezieht sich auf den aktuellen Spieler? Eigentlich auf den, der nachzieht.
            // Wir machen es global am Ende des Zuges.
        }

        // ---------- Zug abschließen ----------
        function finishTurn() {
            // Vorrat auffüllen
            while (state.supply.length < 6) {
                if (state.drawPile.length > 0) {
                    state.supply.push(state.drawPile.pop());
                } else if (settings.reshuffleDiscard && state.discardPile.length > 0) {
                    state.drawPile = shuffle(state.discardPile);
                    state.discardPile = [];
                    state.supply.push(state.drawPile.pop());
                } else {
                    break;
                }
            }

            state.phase = 'idle';
            state.playedCards = [];
            state.playedValue = null;
            state.playedCount = 0;
            state.abluxxTargets = [];
            state.abluxxIndex = 0;
            renderAll();

            // Prüfen auf Spielende
            if (state.players[state.currentPlayerIndex].hand.length === 0) {
                endGame();
                return;
            }

            // Nächster Spieler
            state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;
            renderAll();
            if (state.currentPlayerIndex === 0) {
                setMessage('Du bist dran.');
                startHumanTurn();
            } else {
                setMessage(state.players[state.currentPlayerIndex].name + ' ist am Zug.');
                startBotTurn();
            }
        }

        // ---------- Menschlicher Zug starten ----------
        function startHumanTurn() {
            state.phase = 'idle';
            selectedHandIndex = null;
            renderAll();
            setMessage('Wähle eine Karte aus deiner Hand und klicke auf "Auslegen".');
            updateButtons();
        }

        // ---------- Bot-Zug ----------
        function startBotTurn() {
            if (state.gameOver) return;
            const botIdx = state.currentPlayerIndex;
            const bot = state.players[botIdx];
            if (!bot.isBot) return;

            // 1. Auslegen: Bot wählt einen Wert
            const chosenValue = botDecidePlayValue(botIdx);
            if (chosenValue === null || bot.hand.length === 0) {
                // Keine Karte zum Auslegen -> Zug überspringen? Regel sagt: Zu Beginn muss man auslegen.
                // Wenn keine Karten, dann ist das Spiel eh vorbei (Hand leer) -> würde schon vorher enden.
                // Also falls keine Karten, dann einfach weitermachen.
                setMessage(bot.name + ' hat keine Karten zum Auslegen.');
                finishTurn();
                return;
            }

            const cardsToPlay = bot.hand.filter(v => v === chosenValue);
            bot.hand = bot.hand.filter(v => v !== chosenValue);
            bot.display.push({ value: chosenValue, cards: cardsToPlay });
            state.playedCards = cardsToPlay;
            state.playedValue = chosenValue;
            state.playedCount = cardsToPlay.length;
            state.phase = 'abluxxen';

            setMessage(bot.name + ' legt ' + cardsToPlay.length + ' Karten vom Wert ' + chosenValue + ' aus.');

            // Abluxxen initialisieren
            const total = state.players.length;
            const startIdx = (state.currentPlayerIndex + 1) % total;
            const targets = [];
            for (let i = 0; i < total - 1; i++) {
                const idx = (startIdx + i) % total;
                if (idx === state.currentPlayerIndex) continue;
                targets.push(idx);
            }
            state.abluxxTargets = targets;
            state.abluxxIndex = 0;
            renderAll();
            setTimeout(() => performAbluxxen(), 600);
        }

        // ---------- Bot-Entscheidungen ----------
        function botDecidePlayValue(botIdx) {
            const bot = state.players[botIdx];
            const hand = bot.hand;
            if (hand.length === 0) return null;

            // Zähle Vorkommen
            const counts = {};
            hand.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
            // Werte mit max Anzahl
            let maxCount = 0;
            let candidates = [];
            for (let v in counts) {
                const cnt = counts[v];
                if (cnt > maxCount) {
                    maxCount = cnt;
                    candidates = [parseInt(v)];
                } else if (cnt === maxCount) {
                    candidates.push(parseInt(v));
                }
            }
            // Bei mehreren: höchsten Wert wählen (weil besser)
            candidates.sort((a, b) => b - a);
            // Schwierigkeit: bei 'easy' manchmal zufällig
            if (settings.difficulty === 'easy' && Math.random() < 0.4) {
                // zufälligen Wert aus Hand
                const idx = Math.floor(Math.random() * hand.length);
                return hand[idx];
            }
            return candidates[0];
        }

        function botDecideTakeAbluxxed(targetIdx, playedCards) {
            // Entscheidung: auf Hand nehmen?
            const current = state.players[state.currentPlayerIndex];
            const target = state.players[targetIdx];
            const topPile = target.display[target.display.length - 1];
            const takenCards = topPile.cards;
            const takenValues = takenCards;

            // Wenn der Bot bereits Karten gleichen Werts auf der Hand hat -> nehmen
            for (let v of takenValues) {
                if (current.hand.includes(v)) {
                    return true;
                }
            }
            // Wenn die Karten hohe Werte sind (>=10) -> nehmen
            if (takenValues.some(v => v >= 10)) {
                return true;
            }
            // Wenn Hand klein (< 8) -> nehmen
            if (current.hand.length < 8) {
                return true;
            }
            // Sonst nicht nehmen (außer bei schwer: eher nehmen)
            if (settings.difficulty === 'hard' && Math.random() < 0.6) {
                return true;
            }
            return false;
        }

        function botDecideTakeBack(targetIdx, cards) {
            // Entscheidung, ob abgeluxxte Karten zurückgenommen oder abgeworfen werden
            const target = state.players[targetIdx];
            // Wenn Kartenwert schon auf Hand -> zurücknehmen
            for (let v of cards) {
                if (target.hand.includes(v)) {
                    return true;
                }
            }
            // Wenn Hand klein (< 6) -> zurücknehmen
            if (target.hand.length < 6) {
                return true;
            }
            // Wenn hohe Werte -> zurücknehmen
            if (cards.some(v => v >= 10)) {
                return true;
            }
            // Sonst abwerfen (besonders bei schwer)
            if (settings.difficulty === 'hard' && Math.random() < 0.3) {
                return true;
            }
            return false;
        }

        function botDecideDrawSource(botIdx) {
            // Entscheidung, ob vom Vorrat oder Stapel gezogen wird
            const bot = state.players[botIdx];
            // Wenn Vorrat Karten enthält, die auf der Hand vorhanden sind -> Vorrat bevorzugen
            for (let v of state.supply) {
                if (bot.hand.includes(v)) {
                    return true;
                }
            }
            // Bei hohen Werten im Vorrat -> nehmen
            for (let v of state.supply) {
                if (v >= 10) {
                    return true;
                }
            }
            // sonst eher Stapel (zufällig)
            if (settings.difficulty === 'hard' && Math.random() < 0.3) {
                return true;
            }
            return false;
        }

        // ---------- Spielende ----------
        function endGame() {
            state.gameOver = true;
            state.phase = 'idle';
            // Punkte zählen
            let results = state.players.map((p, idx) => {
                const plus = p.display.reduce((sum, pile) => sum + pile.cards.length, 0);
                const minus = p.hand.length;
                const score = plus - minus;
                return { name: p.name, score, handCount: p.hand.length, plus, minus };
            });
            results.sort((a, b) => b.score - a.score || a.handCount - b.handCount);
            let msg = 'Spielende! Ergebnisse:\n';
            results.forEach((r, i) => {
                msg += `${i+1}. ${r.name}: ${r.score} Punkte (${r.plus} ausgelegt, ${r.minus} Hand)\n`;
            });
            alert(msg);
            setMessage('Spiel beendet! ' + results[0].name + ' gewinnt!');
            renderAll();
            // Buttons deaktivieren
            playBtn.disabled = true;
            endTurnBtn.disabled = true;
        }

        // ---------- Event-Bindings ----------
        playBtn.addEventListener('click', handlePlay);
        endTurnBtn.addEventListener('click', () => {
            if (state.currentPlayerIndex === 0 && state.phase === 'idle' && !state.gameOver) {
                // Nur möglich, wenn man schon ausgelegt hat? Regel: Man muss auslegen. Also nicht erlaubt.
                setMessage('Du musst zuerst Karten auslegen!');
            }
        });

        document.getElementById('settingsToggle').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.toggle('open');
        });

        document.getElementById('applySettings').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.remove('open');
            initGame();
        });

        // Bei Klick auf Vorrat (für Menschen beim Nachziehen) – hier nicht genutzt
        function onSupplyClick(val) {
            // Wird nur im Nachzieh-Modus aktiviert, den wir hier nicht implementieren.
        }

        // ---------- Start ----------
        initGame();

        // Hilfsfunktion für Bot-Zeitverzögerung
        // (bereits verwendet)
    </script>
</body>
</html>
