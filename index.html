<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abluxxen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a2a3a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        #app {
            max-width: 1200px;
            width: 100%;
            background: #2a3f4f;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .game-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .turn-info {
            background: #3a5568;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .turn-info .highlight {
            color: #f1c40f;
        }
        .scores {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .score-badge {
            background: #1e3344;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .score-badge .name {
            color: #aac;
        }
        .score-badge .pts {
            color: #f1c40f;
            font-weight: 700;
        }
        .score-badge.active {
            outline: 2px solid #f1c40f;
            outline-offset: 2px;
        }
        .score-badge.bot {
            opacity: 0.8;
        }
        .score-badge.human {
            opacity: 1;
        }

        /* Pool & Draw pile */
        .game-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 16px 0;
            margin-bottom: 12px;
            background: #1e3344;
            border-radius: 16px;
            min-height: 100px;
            flex-wrap: wrap;
        }
        .pool-area,
        .draw-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .pool-area .label,
        .draw-area .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8aaccc;
        }
        .pool-cards,
        .draw-cards {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Cards */
        .card {
            width: 54px;
            height: 76px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            background: #3a5a7a;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            cursor: default;
            transition: transform 0.15s, box-shadow 0.15s;
            user-select: none;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.15);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }
        .card.joker {
            background: linear-gradient(135deg, #7b2fbe, #9b59b6);
            border-color: #c39bd3;
        }
        .card .card-value {
            font-size: 22px;
            line-height: 1;
        }
        .card .card-sub {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .card.small {
            width: 42px;
            height: 60px;
            font-size: 16px;
        }
        .card.tiny {
            width: 34px;
            height: 48px;
            font-size: 12px;
            border-radius: 5px;
        }
        .card .joker-icon {
            font-size: 26px;
        }
        .card.selected {
            transform: translateY(-16px);
            box-shadow: 0 8px 20px rgba(241, 196, 15, 0.5);
            border-color: #f1c40f;
        }
        .card.clickable {
            cursor: pointer;
        }
        .card.clickable:hover {
            transform: translateY(-6px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }
        .card .card-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Color mapping */
        .card.c0 {
            background: #2ecc71;
        }
        .card.c1 {
            background: #27ae60;
        }
        .card.c2 {
            background: #1abc9c;
        }
        .card.c3 {
            background: #16a085;
        }
        .card.c4 {
            background: #3498db;
        }
        .card.c5 {
            background: #2980b9;
        }
        .card.c6 {
            background: #5dade2;
        }
        .card.c7 {
            background: #2e86c1;
        }
        .card.c8 {
            background: #f1c40f;
            color: #1a2a3a;
        }
        .card.c9 {
            background: #f39c12;
            color: #1a2a3a;
        }
        .card.c10 {
            background: #e67e22;
            color: #1a2a3a;
        }
        .card.c11 {
            background: #d35400;
        }
        .card.c12 {
            background: #e74c3c;
        }
        .card.c13 {
            background: #c0392b;
        }
        .card.c14 {
            background: #8e44ad;
        }
        .card.c15 {
            background: #6c3483;
        }

        /* Player areas */
        .player-area {
            background: #1e3344;
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 10px;
            border-left: 4px solid transparent;
            transition: border-color 0.3s;
        }
        .player-area.active {
            border-left-color: #f1c40f;
            background: #253d52;
        }
        .player-area .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .player-area .player-name {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-area .player-name .badge {
            font-size: 11px;
            background: #3a5568;
            padding: 0 10px;
            border-radius: 12px;
            font-weight: 400;
        }
        .player-area .card-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            min-height: 44px;
        }
        .player-area .card-row .empty-label {
            color: #6a8aaa;
            font-size: 13px;
            font-style: italic;
            opacity: 0.6;
        }
        .player-area .hand-area .card-row {
            min-height: 70px;
            padding: 4px 0;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #3a5568;
            justify-content: center;
        }
        .controls button {
            background: #3a5a7a;
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls button:hover:not(:disabled) {
            background: #4a7a9a;
            transform: scale(1.02);
        }
        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .controls button.primary {
            background: #f1c40f;
            color: #1a2a3a;
        }
        .controls button.primary:hover:not(:disabled) {
            background: #f5d627;
        }
        .controls button.danger {
            background: #e74c3c;
        }
        .controls button.danger:hover:not(:disabled) {
            background: #ef5350;
        }
        .controls button.success {
            background: #2ecc71;
            color: #1a2a3a;
        }
        .controls button.success:hover:not(:disabled) {
            background: #3ddc84;
        }

        /* Abluxx modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #2a3f4f;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #4a6a8a;
        }
        .modal h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .modal .sub {
            color: #aac;
            margin-bottom: 16px;
        }
        .modal .modal-cards {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 12px 0;
        }
        .modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal .modal-actions button {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal .modal-actions button.abluxx-btn {
            background: #e74c3c;
            color: #fff;
        }
        .modal .modal-actions button.abluxx-btn:hover {
            background: #ef5350;
        }
        .modal .modal-actions button.skip-btn {
            background: #3a5568;
            color: #fff;
        }
        .modal .modal-actions button.skip-btn:hover {
            background: #4a6a8a;
        }
        .modal .modal-actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Game Over */
        .game-over-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .game-over-overlay.show {
            display: flex;
        }
        .game-over-box {
            background: #2a3f4f;
            border-radius: 24px;
            padding: 40px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            border: 1px solid #f1c40f;
        }
        .game-over-box h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-over-box .results {
            text-align: left;
            margin: 20px 0;
            padding: 0;
            list-style: none;
        }
        .game-over-box .results li {
            padding: 8px 12px;
            border-bottom: 1px solid #3a5568;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }
        .game-over-box .results li .pos {
            font-weight: 700;
            color: #f1c40f;
            margin-right: 12px;
        }
        .game-over-box .results li .pname {
            flex: 1;
        }
        .game-over-box .results li .pscore {
            font-weight: 700;
        }
        .game-over-box .results li.winner {
            background: #1e3344;
            border-radius: 8px;
            border-bottom: none;
            margin: 4px 0;
            font-weight: 700;
        }
        .game-over-box .btn-restart {
            background: #f1c40f;
            color: #1a2a3a;
            border: none;
            padding: 12px 40px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .game-over-box .btn-restart:hover {
            background: #f5d627;
        }

        /* Setup overlay */
        .setup-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .setup-overlay.hidden {
            display: none;
        }
        .setup-box {
            background: #2a3f4f;
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid #4a6a8a;
        }
        .setup-box h1 {
            font-size: 36px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .setup-box .subtitle {
            color: #aac;
            margin-bottom: 24px;
        }
        .setup-box label {
            display: block;
            margin: 12px 0 4px;
            font-weight: 500;
            color: #cde;
        }
        .setup-box select {
            background: #1e3344;
            color: #fff;
            border: 2px solid #3a5568;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 18px;
            width: 100%;
            max-width: 200px;
            cursor: pointer;
            outline: none;
        }
        .setup-box select:focus {
            border-color: #f1c40f;
        }
        .setup-box .btn-start {
            background: #f1c40f;
            color: #1a2a3a;
            border: none;
            padding: 14px 48px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 24px;
        }
        .setup-box .btn-start:hover {
            background: #f5d627;
        }

        /* Status message */
        .status-msg {
            text-align: center;
            padding: 8px 0 4px;
            font-size: 15px;
            color: #aac;
            min-height: 30px;
        }
        .status-msg .highlight {
            color: #f1c40f;
            font-weight: 600;
        }

        /* Scrollable hand */
        .hand-scroll {
            overflow-x: auto;
            padding: 4px 0;
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            min-height: 76px;
            align-items: center;
        }
        .hand-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .hand-scroll::-webkit-scrollbar-track {
            background: #1a2a3a;
            border-radius: 10px;
        }
        .hand-scroll::-webkit-scrollbar-thumb {
            background: #3a5a7a;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #app {
                padding: 12px;
            }
            .card {
                width: 42px;
                height: 60px;
                font-size: 16px;
            }
            .card .card-value {
                font-size: 17px;
            }
            .card.small {
                width: 34px;
                height: 48px;
                font-size: 12px;
            }
            .card.tiny {
                width: 28px;
                height: 40px;
                font-size: 10px;
            }
            .game-title {
                font-size: 20px;
            }
            .turn-info {
                font-size: 13px;
                padding: 6px 14px;
            }
            .score-badge {
                font-size: 12px;
                padding: 2px 10px;
            }
            .controls button {
                padding: 8px 18px;
                font-size: 13px;
            }
            .game-center {
                gap: 20px;
                padding: 12px 0;
                min-height: 70px;
            }
            .modal {
                padding: 24px;
            }
            .setup-box {
                padding: 28px;
            }
            .player-area {
                padding: 8px 10px;
            }
            .hand-scroll {
                min-height: 60px;
            }
        }
        @media (max-width: 480px) {
            .card {
                width: 34px;
                height: 48px;
                font-size: 13px;
            }
            .card .card-value {
                font-size: 14px;
            }
            .card.small {
                width: 28px;
                height: 40px;
                font-size: 10px;
            }
            .card.tiny {
                width: 22px;
                height: 32px;
                font-size: 8px;
            }
            .game-title {
                font-size: 17px;
            }
            .turn-info {
                font-size: 11px;
                padding: 4px 10px;
            }
            .score-badge {
                font-size: 10px;
                padding: 2px 8px;
            }
            .controls button {
                padding: 6px 14px;
                font-size: 12px;
            }
            .game-center {
                gap: 12px;
                padding: 8px 0;
                min-height: 56px;
            }
            .modal {
                padding: 16px;
            }
            .setup-box {
                padding: 20px;
            }
            .player-area {
                padding: 6px 8px;
            }
            .hand-scroll {
                min-height: 48px;
            }
        }
    </style>
</head>
<body>

    <!-- Setup -->
    <div class="setup-overlay" id="setupOverlay">
        <div class="setup-box">
            <h1>♠ Abluxxen</h1>
            <div class="subtitle">Karten abluxxen – clever taktieren!</div>
            <label for="botCount">Anzahl Bots</label>
            <select id="botCount">
                <option value="1">1 Bot</option>
                <option value="2" selected>2 Bots</option>
                <option value="3">3 Bots</option>
                <option value="4">4 Bots</option>
            </select>
            <label for="gameVariant">Variante</label>
            <select id="gameVariant">
                <option value="basic">Grundspiel</option>
                <option value="advanced">Fortgeschritten (kein Nachziehen)</option>
                <option value="pro">Profi (1er stehlen 13er &amp; Joker)</option>
            </select>
            <button class="btn-start" id="btnStart">Spiel starten</button>
        </div>
    </div>

    <!-- Game Over -->
    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-box">
            <h1>🏆 Spiel vorbei!</h1>
            <ul class="results" id="gameOverResults"></ul>
            <button class="btn-restart" id="btnRestart">🔄 Neues Spiel</button>
        </div>
    </div>

    <!-- Abluxx Modal -->
    <div class="modal-overlay" id="abluxxModal">
        <div class="modal">
            <h2>⚡ Abluxxen!</h2>
            <div class="sub" id="abluxxSub">Du kannst diese Karten abluxxen:</div>
            <div class="modal-cards" id="abluxxCards"></div>
            <div class="modal-actions">
                <button class="abluxx-btn" id="abluxxBtn">Abluxxen!</button>
                <button class="skip-btn" id="abluxxSkip">Überspringen</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Header -->
        <div class="game-header">
            <div class="game-title">♠ Abluxxen</div>
            <div class="turn-info" id="turnInfo">⏳ <span id="turnName">—</span> ist dran</div>
            <div class="scores" id="scoreContainer"></div>
        </div>

        <!-- Center: Pool & Draw -->
        <div class="game-center">
            <div class="pool-area">
                <div class="label">📦 Vorrat</div>
                <div class="pool-cards" id="poolContainer"></div>
            </div>
            <div class="draw-area">
                <div class="label">🃏 Nachziehstapel</div>
                <div class="draw-cards" id="drawContainer">
                    <div class="card" style="width:54px;height:76px;background:#1a2a3a;border:2px dashed #3a5a7a;justify-content:center;font-size:24px;color:#3a5a7a;">?</div>
                </div>
                <div style="font-size:13px;color:#8aaccc;" id="drawCount">0 Karten</div>
            </div>
        </div>

        <!-- Status -->
        <div class="status-msg" id="statusMsg">Klicke Karten in deiner Hand an, um sie auszuwählen.</div>

        <!-- Player areas (injected) -->
        <div id="playerAreas"></div>

        <!-- Controls -->
        <div class="controls" id="controls">
            <button class="primary" id="btnPlay" disabled>▶ Auslegen</button>
            <button id="btnDraw" disabled>📥 Karte ziehen</button>
            <button id="btnClear" disabled>✕ Auswahl löschen</button>
        </div>
    </div>

    <script>
        // ============================================================
        // CARD CLASS
        // ============================================================
        class Card {
            constructor(value, isJoker = false) {
                this.value = value;
                this.isJoker = isJoker;
            }
            get display() {
                return this.isJoker ? '★' : String(this.value);
            }
            get cssClass() {
                if (this.isJoker) return 'joker';
                const v = this.value;
                if (v >= 0 && v <= 15) return 'c' + v;
                return '';
            }
            get colorClass() {
                if (this.isJoker) return 'joker';
                return 'c' + this.value;
            }
            equals(other) {
                if (!other) return false;
                if (this.isJoker && other.isJoker) return true;
                if (this.isJoker || other.isJoker) return false;
                return this.value === other.value;
            }
            // For sorting
            static compare(a, b) {
                if (a.isJoker && b.isJoker) return 0;
                if (a.isJoker) return 1;
                if (b.isJoker) return -1;
                return a.value - b.value;
            }
        }

        // ============================================================
        // DECK
        // ============================================================
        function buildDeck() {
            const cards = [];
            // 0-9: 10 copies each
            for (let v = 0; v <= 9; v++) {
                for (let i = 0; i < 10; i++) cards.push(new Card(v));
            }
            // 10-12: 9 copies each
            for (let v = 10; v <= 12; v++) {
                for (let i = 0; i < 9; i++) cards.push(new Card(v));
            }
            // 13: 10 copies
            for (let i = 0; i < 10; i++) cards.push(new Card(13));
            // 14-15: 10 copies each
            for (let v = 14; v <= 15; v++) {
                for (let i = 0; i < 10; i++) cards.push(new Card(v));
            }
            // Jokers: 4
            for (let i = 0; i < 4; i++) cards.push(new Card(0, true));
            return cards;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ============================================================
        // GAME STATE
        // ============================================================
        let game = null;
        let selectedCards = [];

        // ============================================================
        // GAME CLASS
        // ============================================================
        class Game {
            constructor(numBots, variant = 'basic') {
                this.variant = variant; // 'basic', 'advanced', 'pro'
                this.players = [];
                this.deck = [];
                this.pool = [];
                this.drawPile = [];
                this.currentPlayerIndex = 0;
                this.phase = 'selecting'; // selecting | playing | abluxxing | drawing | ended
                this.turnNumber = 0;
                this.isGameOver = false;
                this.abluxxQueue = [];
                this.pendingDrawCount = 0;
                this.drawnThisTurn = false;

                // Build & shuffle deck
                this.deck = shuffle(buildDeck());

                // Create players: human + bots
                const names = ['Du', 'Bot 1', 'Bot 2', 'Bot 3', 'Bot 4'];
                this.players.push(new Player('Du', false));
                for (let i = 0; i < numBots; i++) {
                    this.players.push(new Player(names[i + 1], true));
                }

                // Deal 11 cards each
                const handSize = 11;
                for (const p of this.players) {
                    p.hand = [];
                    for (let i = 0; i < handSize; i++) {
                        if (this.deck.length > 0) p.hand.push(this.deck.pop());
                    }
                    p.hand.sort(Card.compare);
                    p.display = [];
                }

                // Pool: 6 cards
                this.pool = [];
                for (let i = 0; i < 6; i++) {
                    if (this.deck.length > 0) this.pool.push(this.deck.pop());
                }
                this.drawPile = this.deck;

                this.currentPlayerIndex = 0;
                this.phase = 'selecting';
                this.turnNumber = 0;
                this.isGameOver = false;
                this.abluxxQueue = [];
                this.pendingDrawCount = 0;
                this.drawnThisTurn = false;

                // Sort hands
                for (const p of this.players) {
                    p.hand.sort(Card.compare);
                }
            }

            get currentPlayer() {
                return this.players[this.currentPlayerIndex];
            }

            get humanPlayer() {
                return this.players[0];
            }

            get isHumanTurn() {
                return this.currentPlayerIndex === 0 && !this.isGameOver;
            }

            // Get players in turn order starting after current
            getOpponentsInOrder() {
                const result = [];
                const n = this.players.length;
                for (let i = 1; i < n; i++) {
                    const idx = (this.currentPlayerIndex + i) % n;
                    result.push(this.players[idx]);
                }
                return result;
            }

            // Play cards from hand to display
            playCards(player, cards) {
                if (cards.length === 0) return false;
                // All cards must have same value (or all jokers, or mix? rule: same number, jokers are wild)
                // In Abluxxen, you play cards of the same number. Jokers can be played with any number?
                // Actually, jokers are played as wild cards - they can be played with any number.
                // But for abluxxen, the count and value matter.
                // Let's require that all non-joker cards have the same value.
                const nonJokers = cards.filter(c => !c.isJoker);
                if (nonJokers.length > 0) {
                    const firstVal = nonJokers[0].value;
                    for (const c of nonJokers) {
                        if (c.value !== firstVal) return false;
                    }
                }
                // Remove from hand
                for (const c of cards) {
                    const idx = player.hand.indexOf(c);
                    if (idx !== -1) player.hand.splice(idx, 1);
                }
                // Add to display
                for (const c of cards) {
                    player.display.push(c);
                }
                // Sort display by value (jokers last)
                player.display.sort((a, b) => {
                    if (a.isJoker && b.isJoker) return 0;
                    if (a.isJoker) return 1;
                    if (b.isJoker) return -1;
                    return a.value - b.value;
                });
                return true;
            }

            // Check if player can abluxx opponent
            canAbluxx(playedCards, opponent) {
                if (opponent.display.length === 0) return false;
                // Count must match
                if (playedCards.length !== opponent.display.length) return false;
                // Value must be higher (all played cards must be higher than all opponent's display cards)
                // For jokers: in pro variant, jokers and 13s can be stolen with 1s
                // In basic: jokers are wild, but the value comparison is based on the played cards' value
                const playedValue = this.getPlayedValue(playedCards);
                const oppValue = this.getDisplayValue(opponent);
                if (playedValue === null || oppValue === null) return false;
                // Pro variant: 13er and Joker can be stolen with 1ern
                if (this.variant === 'pro') {
                    // If opponent's display has 13 or joker, and played cards are 1s, can abluxx
                    const oppHasSpecial = opponent.display.some(c => c.isJoker || c.value === 13);
                    if (oppHasSpecial && playedValue === 1) {
                        // But only if the count matches (already checked)
                        return true;
                    }
                }
                return playedValue > oppValue;
            }

            getPlayedValue(cards) {
                // All non-joker cards must have the same value, or all jokers
                const nonJokers = cards.filter(c => !c.isJoker);
                if (nonJokers.length === 0) {
                    // All jokers - value is 0? Or they can be considered as any value?
                    // In the game, jokers played alone have value 0 for abluxxen purposes
                    // But in pro variant, jokers can be stolen with 1s
                    return 0;
                }
                // All non-jokers should have the same value
                const val = nonJokers[0].value;
                for (const c of nonJokers) {
                    if (c.value !== val) return null;
                }
                return val;
            }

            getDisplayValue(player) {
                if (player.display.length === 0) return null;
                // All cards in display should have the same value (or jokers)
                const nonJokers = player.display.filter(c => !c.isJoker);
                if (nonJokers.length === 0) {
                    // All jokers - value is 0
                    return 0;
                }
                const val = nonJokers[0].value;
                for (const c of nonJokers) {
                    if (c.value !== val) return null;
                }
                return val;
            }

            // Execute abluxx: steal opponent's display, they draw replacements
            executeAbluxx(player, opponent) {
                const stolen = [...opponent.display];
                opponent.display = [];
                // Add stolen cards to player's hand
                for (const c of stolen) {
                    player.hand.push(c);
                }
                player.hand.sort(Card.compare);
                // Opponent draws same number of cards
                const count = stolen.length;
                this.pendingDrawCount = count;
                this.drawForPlayer(opponent, count);
                return stolen;
            }

            drawForPlayer(player, count) {
                let drawn = 0;
                // First from pool
                while (drawn < count && this.pool.length > 0) {
                    const c = this.pool.pop();
                    player.hand.push(c);
                    drawn++;
                }
                // Then from draw pile
                while (drawn < count && this.drawPile.length > 0) {
                    const c = this.drawPile.pop();
                    player.hand.push(c);
                    drawn++;
                }
                // Refill pool from draw pile
                this.refillPool();
                // Sort hand
                player.hand.sort(Card.compare);
                // If we couldn't draw enough, game might end
                if (drawn < count) {
                    // Check if game should end: draw pile empty and pool can't be refilled
                    if (this.drawPile.length === 0 && this.pool.length === 0) {
                        this.isGameOver = true;
                    }
                }
                return drawn;
            }

            refillPool() {
                while (this.pool.length < 6 && this.drawPile.length > 0) {
                    this.pool.push(this.drawPile.pop());
                }
            }

            // Check if game should end
            checkGameEnd() {
                // Player has no cards in hand
                for (const p of this.players) {
                    if (p.hand.length === 0) {
                        this.isGameOver = true;
                        return true;
                    }
                }
                // Draw pile empty and pool empty
                if (this.drawPile.length === 0 && this.pool.length === 0) {
                    this.isGameOver = true;
                    return true;
                }
                return false;
            }

            // Advance to next player
            nextTurn() {
                this.turnNumber++;
                this.drawnThisTurn = false;
                // Find next player with cards
                let next = (this.currentPlayerIndex + 1) % this.players.length;
                let attempts = 0;
                while (this.players[next].hand.length === 0 && attempts < this.players.length) {
                    next = (next + 1) % this.players.length;
                    attempts++;
                }
                this.currentPlayerIndex = next;
                this.phase = 'selecting';
                selectedCards = [];
                // Check game end
                if (this.checkGameEnd()) {
                    this.phase = 'ended';
                }
            }

            // Get current scores (for display)
            getScores() {
                return this.players.map(p => {
                    const displayPts = p.display.length;
                    const handPts = p.hand.length;
                    return { name: p.name, displayPts, handPts, total: displayPts - handPts };
                });
            }

            // Final scoring
            getFinalScores() {
                return this.players.map(p => {
                    const displayPts = p.display.length;
                    const handPts = p.hand.length;
                    return { name: p.name, displayPts, handPts, total: displayPts - handPts, hand: p.hand.length };
                });
            }
        }

        // ============================================================
        // PLAYER CLASS
        // ============================================================
        class Player {
            constructor(name, isBot) {
                this.name = name;
                this.isBot = isBot;
                this.hand = [];
                this.display = [];
            }
        }

        // ============================================================
        // BOT AI
        // ============================================================
        class BotAI {
            static decide(game) {
                const player = game.currentPlayer;
                if (!player.isBot) return null;

                // 1. Find best play: cards that can abluxx someone
                const opponents = game.getOpponentsInOrder();
                const handMap = new Map();
                for (const c of player.hand) {
                    const key = c.isJoker ? 'joker' : c.value;
                    if (!handMap.has(key)) handMap.set(key, []);
                    handMap.get(key).push(c);
                }

                // Check each value group for abluxx potential
                let bestPlay = null;
                let bestOpponent = null;

                for (const [key, cards] of handMap) {
                    // Try different counts (play all cards of this value, or subsets)
                    for (let count = 1; count <= cards.length; count++) {
                        const subset = cards.slice(0, count);
                        for (const opp of opponents) {
                            if (game.canAbluxx(subset, opp)) {
                                // Found a valid abluxx play
                                if (!bestPlay || subset.length > bestPlay.length) {
                                    bestPlay = subset;
                                    bestOpponent = opp;
                                }
                            }
                        }
                    }
                }

                if (bestPlay) {
                    return { action: 'abluxx', cards: bestPlay, opponent: bestOpponent };
                }

                // 2. No abluxx possible - play cards to build display
                // Strategy: play the lowest value cards (or jokers) that have at least 1 copy
                const sortedGroups = [];
                for (const [key, cards] of handMap) {
                    sortedGroups.push({ key, cards, count: cards.length });
                }
                // Sort by value (jokers last)
                sortedGroups.sort((a, b) => {
                    if (a.key === 'joker' && b.key === 'joker') return 0;
                    if (a.key === 'joker') return 1;
                    if (b.key === 'joker') return -1;
                    return a.key - b.key;
                });

                // Play the smallest group
                if (sortedGroups.length > 0) {
                    const group = sortedGroups[0];
                    const cardsToPlay = group.cards.slice(0, group.count);
                    // But don't play all if we can help it - play just enough to be useful
                    // Play all of the smallest value
                    return { action: 'play', cards: cardsToPlay };
                }

                // 3. Fallback: play any card
                if (player.hand.length > 0) {
                    return { action: 'play', cards: [player.hand[0]] };
                }

                return null;
            }
        }

        // ============================================================
        // UI RENDERER
        // ============================================================
        function render(game) {
            if (!game) return;
            renderHeader(game);
            renderCenter(game);
            renderPlayers(game);
            renderControls(game);
            renderStatus(game);
        }

        function renderHeader(game) {
            const turnName = document.getElementById('turnName');
            const turnInfo = document.getElementById('turnInfo');
            if (game.isGameOver) {
                turnName.textContent = '🏁 Spiel beendet';
                turnInfo.className = 'turn-info';
            } else {
                const p = game.currentPlayer;
                turnName.textContent = p.name + (p.isBot ? ' 🤖' : ' 🧑');
                turnInfo.className = 'turn-info';
                if (game.isHumanTurn) {
                    turnInfo.style.border = '2px solid #f1c40f';
                } else {
                    turnInfo.style.border = '2px solid transparent';
                }
            }

            const container = document.getElementById('scoreContainer');
            const scores = game.getScores();
            container.innerHTML = scores.map((s, i) => {
                const p = game.players[i];
                const isActive = i === game.currentPlayerIndex && !game.isGameOver;
                const isHuman = i === 0;
                const cls = 'score-badge' + (isActive ? ' active' : '') + (isHuman ? ' human' : ' bot');
                return `<span class="${cls}"><span class="name">${p.name}</span> <span class="pts">${s.total}</span> (📤${s.displayPts} 📥${s.handPts})</span>`;
            }).join('');
        }

        function renderCenter(game) {
            // Pool
            const poolContainer = document.getElementById('poolContainer');
            poolContainer.innerHTML = game.pool.map(c => renderCard(c, false, true)).join('');

            // Draw pile
            const drawContainer = document.getElementById('drawContainer');
            const count = game.drawPile.length;
            document.getElementById('drawCount').textContent = count + ' Karten';
            if (count === 0) {
                drawContainer.innerHTML =
                    `<div class="card" style="width:54px;height:76px;background:#1a2a3a;border:2px dashed #3a5a7a;justify-content:center;font-size:24px;color:#3a5a7a;">∅</div>`;
            } else {
                drawContainer.innerHTML =
                    `<div class="card" style="width:54px;height:76px;background:#1a2a3a;border:2px solid #3a5a7a;justify-content:center;font-size:24px;color:#6a8aaa;">🃏</div>`;
            }
        }

        function renderCard(card, selected = false, small = false, tiny = false) {
            const cls = 'card' +
                (card ? ' ' + card.colorClass : '') +
                (selected ? ' selected' : '') +
                (small ? ' small' : '') +
                (tiny ? ' tiny' : '') +
                (card && card.isJoker ? ' joker' : '');
            let inner = '';
            if (card) {
                if (card.isJoker) {
                    inner = `<span class="joker-icon">★</span><span class="card-sub">Joker</span>`;
                } else {
                    inner = `<span class="card-value">${card.value}</span>`;
                }
            } else {
                inner = `<span style="opacity:0.3;">?</span>`;
            }
            return `<div class="${cls}">${inner}</div>`;
        }

        function renderPlayers(game) {
            const container = document.getElementById('playerAreas');
            let html = '';
            for (let i = 0; i < game.players.length; i++) {
                const p = game.players[i];
                const isActive = i === game.currentPlayerIndex && !game.isGameOver;
                const isHuman = i === 0;
                const activeCls = isActive ? ' active' : '';
                html += `<div class="player-area${activeCls}">`;
                html += `<div class="player-header">`;
                html += `<span class="player-name">${p.name} ${p.isBot ? '🤖' : '🧑'} <span class="badge">${p.hand.length} auf Hand</span></span>`;
                html += `<span style="font-size:13px;color:#8aaccc;">📤 ${p.display.length} Karten</span>`;
                html += `</div>`;

                // Display
                html += `<div class="card-row">`;
                if (p.display.length === 0) {
                    html += `<span class="empty-label">— keine Karten ausgelegt —</span>`;
                } else {
                    for (const c of p.display) {
                        html += renderCard(c, false, true);
                    }
                }
                html += `</div>`;

                // Hand (only show for human, or show hidden for bots)
                html += `<div class="hand-area" style="margin-top:6px;">`;
                if (isHuman) {
                    html += `<div class="hand-scroll" id="humanHand">`;
                    for (const c of p.hand) {
                        const sel = selectedCards.includes(c);
                        html += renderCard(c, sel, false, false);
                    }
                    html += `</div>`;
                    // Attach click listeners after rendering
                } else {
                    // Bots: show count only
                    html +=
                        `<div style="color:#6a8aaa;font-size:13px;padding:4px 0;">🃏 ${p.hand.length} Karten (verdeckt)</div>`;
                }
                html += `</div>`;
                html += `</div>`;
            }
            container.innerHTML = html;

            // Attach click handlers for human hand
            if (game && game.humanPlayer) {
                const handEl = document.getElementById('humanHand');
                if (handEl) {
                    const cards = handEl.querySelectorAll('.card');
                    cards.forEach((el, idx) => {
                        const card = game.humanPlayer.hand[idx];
                        if (card) {
                            el.classList.add('clickable');
                            el.addEventListener('click', () => {
                                if (game.isHumanTurn && game.phase === 'selecting') {
                                    toggleSelect(card);
                                }
                            });
                        }
                    });
                }
            }
        }

        function renderControls(game) {
            const btnPlay = document.getElementById('btnPlay');
            const btnDraw = document.getElementById('btnDraw');
            const btnClear = document.getElementById('btnClear');

            const isHuman = game && game.isHumanTurn && game.phase === 'selecting' && !game.isGameOver;

            btnPlay.disabled = !(isHuman && selectedCards.length > 0);
            btnDraw.disabled = !(isHuman && game.phase === 'selecting' && !game.drawnThisTurn);
            btnClear.disabled = !(isHuman && selectedCards.length > 0);

            if (game && game.variant === 'advanced' || game && game.variant === 'pro') {
                // In advanced/pro, you cannot draw if you couldn't abluxx
                // But we handle this in the logic
            }
        }

        function renderStatus(game) {
            const el = document.getElementById('statusMsg');
            if (!game) {
                el.textContent = 'Starte ein neues Spiel.';
                return;
            }
            if (game.isGameOver) {
                el.innerHTML = '🏁 <span class="highlight">Spiel beendet!</span> Klicke auf "Neues Spiel" für eine Runde.';
                return;
            }
            const p = game.currentPlayer;
            if (game.phase === 'selecting') {
                if (p.isBot) {
                    el.innerHTML = `🤖 <span class="highlight">${p.name}</span> denkt nach ...`;
                } else {
                    const count = selectedCards.length;
                    el.innerHTML =
                        `🧑 Dein Zug. Wähle Karten aus (gleicher Wert) und klicke auf <span class="highlight">"Auslegen"</span>. ${count > 0 ? `(${count} ausgewählt)` : ''}`;
                }
            } else if (game.phase === 'playing') {
                el.innerHTML = `⏳ Karten werden ausgelegt ...`;
            } else if (game.phase === 'abluxxing') {
                el.innerHTML = `⚡ <span class="highlight">Abluxxen!</span> Wähle eine Option.`;
            } else if (game.phase === 'drawing') {
                el.innerHTML = `📥 <span class="highlight">${p.name}</span> zieht Karten nach ...`;
            } else {
                el.textContent = '';
            }
        }

        // ============================================================
        // INTERACTION
        // ============================================================
        function toggleSelect(card) {
            if (!game || !game.isHumanTurn || game.phase !== 'selecting') return;
            const idx = selectedCards.indexOf(card);
            if (idx !== -1) {
                selectedCards.splice(idx, 1);
            } else {
                // Check if card can be selected with current selection
                const nonJokers = selectedCards.filter(c => !c.isJoker);
                const thisNonJoker = card.isJoker ? null : card;
                if (selectedCards.length === 0) {
                    selectedCards.push(card);
                } else {
                    // All non-jokers must have same value
                    const firstNonJoker = selectedCards.find(c => !c.isJoker);
                    if (card.isJoker) {
                        // Joker can be added to any selection
                        selectedCards.push(card);
                    } else if (firstNonJoker) {
                        if (card.value === firstNonJoker.value) {
                            selectedCards.push(card);
                        } else {
                            // Can't mix values
                            showStatus('❌ Du kannst nur Karten mit dem gleichen Wert auslegen.', true);
                            return;
                        }
                    } else {
                        // No non-jokers yet, this becomes the first
                        selectedCards.push(card);
                    }
                }
            }
            render(game);
            renderControls(game);
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('statusMsg');
            el.innerHTML = msg;
            if (isError) {
                el.style.color = '#e74c3c';
                setTimeout(() => { el.style.color = ''; }, 2000);
            }
        }

        // ============================================================
        // GAME ACTIONS
        // ============================================================
        function handlePlay() {
            if (!game || !game.isHumanTurn || game.phase !== 'selecting') return;
            if (selectedCards.length === 0) return;

            const cards = [...selectedCards];
            selectedCards = [];
            game.phase = 'playing';

            // Validate all cards have same value (non-jokers)
            const nonJokers = cards.filter(c => !c.isJoker);
            if (nonJokers.length > 0) {
                const val = nonJokers[0].value;
                for (const c of nonJokers) {
                    if (c.value !== val) {
                        game.phase = 'selecting';
                        showStatus('❌ Alle Karten müssen den gleichen Wert haben.', true);
                        render(game);
                        return;
                    }
                }
            }

            // Play cards
            const success = game.playCards(game.currentPlayer, cards);
            if (!success) {
                game.phase = 'selecting';
                showStatus('❌ Ungültiger Zug.', true);
                render(game);
                return;
            }

            render(game);

            // Check for abluxxen
            const player = game.currentPlayer;
            const opponents = game.getOpponentsInOrder();
            const abluxxTargets = [];

            for (const opp of opponents) {
                if (game.canAbluxx(cards, opp)) {
                    abluxxTargets.push(opp);
                }
            }

            if (abluxxTargets.length > 0) {
                // Show abluxx modal for human
                game.phase = 'abluxxing';
                showAbluxxModal(cards, abluxxTargets);
                render(game);
                return;
            }

            // No abluxx possible
            handleNoAbluxx();
        }

        function handleNoAbluxx() {
            const player = game.currentPlayer;
            // In advanced/pro, cannot draw
            const canDraw = game.variant === 'basic' && !game.drawnThisTurn;

            if (canDraw) {
                // Ask player if they want to draw
                game.phase = 'drawing';
                // Show draw option
                render(game);
                // Enable draw button
                document.getElementById('btnDraw').disabled = false;
                showStatus('📥 Du konntest niemanden abluxxen. Ziehe eine Karte oder beende den Zug.');
                // We'll handle draw via button
            } else {
                // End turn
                finishTurn();
            }
        }

        function handleDraw() {
            if (!game || !game.isHumanTurn || game.phase !== 'drawing') return;
            if (game.variant !== 'basic') {
                showStatus('❌ In dieser Variante darfst du nicht nachziehen.', true);
                return;
            }
            if (game.drawnThisTurn) {
                showStatus('❌ Du hast bereits eine Karte gezogen.', true);
                return;
            }

            // Draw from pool or draw pile (player chooses - we'll draw from pool first)
            let drawn = false;
            if (game.pool.length > 0) {
                const c = game.pool.pop();
                game.currentPlayer.hand.push(c);
                game.currentPlayer.hand.sort(Card.compare);
                game.refillPool();
                drawn = true;
            } else if (game.drawPile.length > 0) {
                const c = game.drawPile.pop();
                game.currentPlayer.hand.push(c);
                game.currentPlayer.hand.sort(Card.compare);
                drawn = true;
            } else {
                showStatus('❌ Keine Karten mehr zum Ziehen.', true);
                return;
            }

            if (drawn) {
                game.drawnThisTurn = true;
                game.phase = 'selecting';
                document.getElementById('btnDraw').disabled = true;
                showStatus('✅ Karte gezogen! Beende deinen Zug.');
                render(game);
                // Check if game ended
                if (game.checkGameEnd()) {
                    game.phase = 'ended';
                    render(game);
                    showGameOver();
                    return;
                }
                // Auto-end turn after draw (in basic rules, you draw and then turn ends)
                // Actually, the rules say: after drawing, your turn is over.
                // So we finish the turn.
                finishTurn();
            }
        }

        function finishTurn() {
            if (!game) return;
            game.phase = 'selecting';
            // Check game end
            if (game.checkGameEnd()) {
                game.phase = 'ended';
                render(game);
                showGameOver();
                return;
            }
            // Move to next player
            game.nextTurn();
            render(game);

            // If next is bot, trigger bot turn
            if (!game.isGameOver && game.currentPlayer.isBot) {
                setTimeout(() => botTurn(), 600);
            } else if (!game.isGameOver && game.isHumanTurn) {
                showStatus('🧑 Du bist dran! Wähle Karten aus.');
            }
        }

        function clearSelection() {
            selectedCards = [];
            render(game);
            renderControls(game);
            showStatus('🧑 Auswahl gelöscht.');
        }

        // ============================================================
        // ABLUXX MODAL
        // ============================================================
        let abluxxModalResolve = null;

        function showAbluxxModal(playedCards, targets) {
            const modal = document.getElementById('abluxxModal');
            const sub = document.getElementById('abluxxSub');
            const cardsContainer = document.getElementById('abluxxCards');
            const btnAbluxx = document.getElementById('abluxxBtn');
            const btnSkip = document.getElementById('abluxxSkip');

            // Show played cards
            cardsContainer.innerHTML = playedCards.map(c => renderCard(c, false, false)).join('');

            // Build target list
            const targetNames = targets.map(t => t.name).join(', ');
            sub.textContent = `Du kannst bei ${targetNames} abluxxen! Wähle wen.`;

            // Store targets
            let currentTargetIndex = 0;

            function updateButtons() {
                if (currentTargetIndex >= targets.length) {
                    btnAbluxx.disabled = true;
                    btnAbluxx.textContent = 'Keine mehr';
                    btnSkip.textContent = 'Fertig';
                    return;
                }
                const t = targets[currentTargetIndex];
                btnAbluxx.textContent = `Abluxxen bei ${t.name}`;
                btnAbluxx.disabled = false;
                btnSkip.textContent = 'Überspringen';
            }

            btnAbluxx.onclick = () => {
                if (currentTargetIndex >= targets.length) {
                    modal.classList.remove('show');
                    if (abluxxModalResolve) abluxxModalResolve(null);
                    return;
                }
                const target = targets[currentTargetIndex];
                modal.classList.remove('show');
                if (abluxxModalResolve) abluxxModalResolve(target);
            };

            btnSkip.onclick = () => {
                currentTargetIndex++;
                if (currentTargetIndex >= targets.length) {
                    modal.classList.remove('show');
                    if (abluxxModalResolve) abluxxModalResolve(null);
                    return;
                }
                updateButtons();
                // Update sub to show next target
                const remaining = targets.slice(currentTargetIndex);
                sub.textContent = `Bei ${remaining.map(t => t.name).join(', ')} kannst du noch abluxxen.`;
            };

            updateButtons();
            modal.classList.add('show');

            return new Promise((resolve) => {
                abluxxModalResolve = (target) => {
                    modal.classList.remove('show');
                    resolve(target);
                };
            });
        }

        // ============================================================
        // HANDLE ABLUXX FROM MODAL
        // ============================================================
        async function handleAbluxxFromModal(playedCards, targets) {
            const target = await showAbluxxModal(playedCards, targets);
            if (!target) {
                // Player skipped all
                handleNoAbluxx();
                return;
            }
            // Execute abluxx
            const player = game.currentPlayer;
            const stolen = game.executeAbluxx(player, target);
            showStatus(`⚡ ${player.name} hat ${stolen.length} Karten von ${target.name} abgeluxxt!`);
            render(game);

            // Check if game ended
            if (game.checkGameEnd()) {
                game.phase = 'ended';
                render(game);
                showGameOver();
                return;
            }

            // After abluxx, turn ends (in all variants, abluxx ends the turn)
            // But wait - in the rules, after abluxxing, the turn ends.
            // The player who abluxxed has stolen cards and the opponent has drawn.
            // Now it's the next player's turn.
            finishTurn();
        }

        // ============================================================
        // BOT TURN
        // ============================================================
        function botTurn() {
            if (!game || game.isGameOver) return;
            if (!game.currentPlayer.isBot) return;

            const player = game.currentPlayer;
            const decision = BotAI.decide(game);

            if (!decision) {
                // Bot has no cards? Shouldn't happen, but handle
                if (player.hand.length === 0) {
                    game.checkGameEnd();
                    if (game.isGameOver) {
                        render(game);
                        showGameOver();
                        return;
                    }
                }
                finishTurn();
                return;
            }

            const cards = decision.cards;

            if (decision.action === 'abluxx') {
                // Bot plays cards and abluxx
                const success = game.playCards(player, cards);
                if (!success) {
                    finishTurn();
                    return;
                }
                render(game);

                const opponent = decision.opponent;
                const stolen = game.executeAbluxx(player, opponent);
                showStatus(`🤖 ${player.name} hat ${stolen.length} Karten von ${opponent.name} abgeluxxt!`);

                // Check game end
                if (game.checkGameEnd()) {
                    game.phase = 'ended';
                    render(game);
                    showGameOver();
                    return;
                }
                // Bot turn ends after abluxx
                setTimeout(() => finishTurn(), 400);

            } else {
                // Bot plays cards (no abluxx)
                const success = game.playCards(player, cards);
                if (!success) {
                    finishTurn();
                    return;
                }
                render(game);

                // Check if bot can abluxx (with the cards they just played)
                const opponents = game.getOpponentsInOrder();
                let abluxxed = false;
                for (const opp of opponents) {
                    if (game.canAbluxx(cards, opp)) {
                        const stolen = game.executeAbluxx(player, opp);
                        showStatus(`🤖 ${player.name} hat ${stolen.length} Karten von ${opp.name} abgeluxxt!`);
                        abluxxed = true;
                        if (game.checkGameEnd()) {
                            game.phase = 'ended';
                            render(game);
                            showGameOver();
                            return;
                        }
                        break;
                    }
                }

                // If no abluxx, bot may draw (basic rules)
                if (!abluxxed && game.variant === 'basic' && !game.drawnThisTurn) {
                    // Bot draws if possible
                    let drawn = false;
                    if (game.pool.length > 0) {
                        const c = game.pool.pop();
                        player.hand.push(c);
                        player.hand.sort(Card.compare);
                        game.refillPool();
                        drawn = true;
                    } else if (game.drawPile.length > 0) {
                        const c = game.drawPile.pop();
                        player.hand.push(c);
                        player.hand.sort(Card.compare);
                        drawn = true;
                    }
                    if (drawn) {
                        game.drawnThisTurn = true;
                        showStatus(`🤖 ${player.name} hat eine Karte gezogen.`);
                        render(game);
                    }
                }

                // Check game end
                if (game.checkGameEnd()) {
                    game.phase = 'ended';
                    render(game);
                    showGameOver();
                    return;
                }

                // Turn ends
                setTimeout(() => finishTurn(), 400);
            }
        }

        // ============================================================
        // GAME OVER
        // ============================================================
        function showGameOver() {
            if (!game) return;
            const overlay = document.getElementById('gameOverOverlay');
            const results = document.getElementById('gameOverResults');

            const scores = game.getFinalScores();
            // Sort by total descending, then by hand cards ascending
            const sorted = scores.map((s, i) => ({ ...s, index: i }));
            sorted.sort((a, b) => {
                if (b.total !== a.total) return b.total - a.total;
                return a.hand - b.hand;
            });

            let html = '';
            const winnerTotal = sorted[0].total;
            let rank = 1;
            for (let i = 0; i < sorted.length; i++) {
                const s = sorted[i];
                const isWinner = s.total === winnerTotal && i === 0;
                const isTie = i > 0 && s.total === winnerTotal;
                const cls = isWinner ? 'winner' : '';
                const medal = isWinner ? '🥇 ' : (isTie ? '👑 ' : `${rank}. `);
                if (!isWinner && !isTie) rank++;
                const nameDisplay = s.name + (s.name === 'Du' ? ' 🧑' : ' 🤖');
                html += `<li class="${cls}">
                    <span><span class="pos">${medal}</span><span class="pname">${nameDisplay}</span></span>
                    <span class="pscore">${s.total} Punkte (📤${s.displayPts} 📥${s.handPts})</span>
                </li>`;
            }
            results.innerHTML = html;
            overlay.classList.add('show');
        }

        // ============================================================
        // SETUP
        // ============================================================
        function startGame() {
            const botCount = parseInt(document.getElementById('botCount').value);
            const variant = document.getElementById('gameVariant').value;
            document.getElementById('setupOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.remove('show');

            selectedCards = [];
            game = new Game(botCount, variant);
            render(game);

            // Start game
            if (game.currentPlayer.isBot) {
                setTimeout(() => botTurn(), 500);
            } else {
                showStatus('🧑 Du bist dran! Wähle Karten aus deiner Hand.');
            }
        }

        function restartGame() {
            document.getElementById('gameOverOverlay').classList.remove('show');
            document.getElementById('setupOverlay').classList.remove('hidden');
            game = null;
            selectedCards = [];
        }

        // ============================================================
        // EVENT BINDING
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnStart').addEventListener('click', startGame);
            document.getElementById('btnRestart').addEventListener('click', restartGame);
            document.getElementById('btnPlay').addEventListener('click', handlePlay);
            document.getElementById('btnDraw').addEventListener('click', handleDraw);
            document.getElementById('btnClear').addEventListener('click', clearSelection);

            // Keyboard shortcut: Enter to play
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const btn = document.getElementById('btnPlay');
                    if (!btn.disabled) btn.click();
                }
                if (e.key === 'Escape') {
                    clearSelection();
                }
                if (e.key === 'd' || e.key === 'D') {
                    const btn = document.getElementById('btnDraw');
                    if (!btn.disabled) btn.click();
                }
            });
        });

        // Expose for debugging
        window.__game = () => game;
        window.__render = () => render(game);

        // ============================================================
        // OVERRIDE: handlePlay to support async abluxx
        // ============================================================
        // Patch handlePlay to use async flow
        const origHandlePlay = handlePlay;
        handlePlay = async function() {
            if (!game || !game.isHumanTurn || game.phase !== 'selecting') return;
            if (selectedCards.length === 0) return;

            const cards = [...selectedCards];
            selectedCards = [];
            game.phase = 'playing';

            const nonJokers = cards.filter(c => !c.isJoker);
            if (nonJokers.length > 0) {
                const val = nonJokers[0].value;
                for (const c of nonJokers) {
                    if (c.value !== val) {
                        game.phase = 'selecting';
                        showStatus('❌ Alle Karten müssen den gleichen Wert haben.', true);
                        render(game);
                        return;
                    }
                }
            }

            const success = game.playCards(game.currentPlayer, cards);
            if (!success) {
                game.phase = 'selecting';
                showStatus('❌ Ungültiger Zug.', true);
                render(game);
                return;
            }

            render(game);

            const player = game.currentPlayer;
            const opponents = game.getOpponentsInOrder();
            const abluxxTargets = [];

            for (const opp of opponents) {
                if (game.canAbluxx(cards, opp)) {
                    abluxxTargets.push(opp);
                }
            }

            if (abluxxTargets.length > 0) {
                game.phase = 'abluxxing';
                render(game);
                // Show modal and wait for choice
                await handleAbluxxFromModal(cards, abluxxTargets);
                return;
            }

            // No abluxx
            handleNoAbluxx();
        };

        // Also patch finishTurn to handle bot turns properly
        const origFinishTurn = finishTurn;
        finishTurn = function() {
            if (!game) return;
            game.phase = 'selecting';
            if (game.checkGameEnd()) {
                game.phase = 'ended';
                render(game);
                showGameOver();
                return;
            }
            game.nextTurn();
            render(game);

            if (!game.isGameOver && game.currentPlayer.isBot) {
                setTimeout(() => botTurn(), 500);
            } else if (!game.isGameOver && game.isHumanTurn) {
                showStatus('🧑 Du bist dran! Wähle Karten aus.');
                renderControls(game);
            }
        };

        // Also patch handleNoAbluxx
        const origHandleNoAbluxx = handleNoAbluxx;
        handleNoAbluxx = function() {
            const player = game.currentPlayer;
            const canDraw = game.variant === 'basic' && !game.drawnThisTurn;

            if (canDraw) {
                game.phase = 'drawing';
                render(game);
                document.getElementById('btnDraw').disabled = false;
                showStatus('📥 Du konntest niemanden abluxxen. Ziehe eine Karte oder beende den Zug.');
                // We'll handle draw via button
                // Also add a "beenden" option - we'll treat clicking "Auslegen" with no cards as end turn
                // Actually, let's add a special handler: if phase is drawing and btnPlay is clicked with no cards, end turn
                const origPlayHandler = document.getElementById('btnPlay').onclick;
                document.getElementById('btnPlay').onclick = function() {
                    if (game && game.phase === 'drawing' && game.isHumanTurn) {
                        // End turn without drawing
                        finishTurn();
                        return;
                    }
                    // Otherwise, normal play
                    handlePlay();
                };
                // Restore after
                setTimeout(() => {
                    if (game && game.phase === 'drawing') {
                        document.getElementById('btnPlay').onclick = function() {
                            if (game && game.phase === 'drawing' && game.isHumanTurn) {
                                finishTurn();
                                return;
                            }
                            handlePlay();
                        };
                    }
                }, 100);
            } else {
                // No draw allowed
                finishTurn();
            }
        };

        // Override handleDraw to properly finish turn
        const origHandleDraw = handleDraw;
        handleDraw = function() {
            if (!game || !game.isHumanTurn || game.phase !== 'drawing') return;
            if (game.variant !== 'basic') {
                showStatus('❌ In dieser Variante darfst du nicht nachziehen.', true);
                return;
            }
            if (game.drawnThisTurn) {
                showStatus('❌ Du hast bereits eine Karte gezogen.', true);
                return;
            }

            let drawn = false;
            if (game.pool.length > 0) {
                const c = game.pool.pop();
                game.currentPlayer.hand.push(c);
                game.currentPlayer.hand.sort(Card.compare);
                game.refillPool();
                drawn = true;
            } else if (game.drawPile.length > 0) {
                const c = game.drawPile.pop();
                game.currentPlayer.hand.push(c);
                game.currentPlayer.hand.sort(Card.compare);
                drawn = true;
            } else {
                showStatus('❌ Keine Karten mehr zum Ziehen.', true);
                return;
            }

            if (drawn) {
                game.drawnThisTurn = true;
                game.phase = 'selecting';
                document.getElementById('btnDraw').disabled = true;
                showStatus('✅ Karte gezogen! Zug beendet.');
                render(game);
                if (game.checkGameEnd()) {
                    game.phase = 'ended';
                    render(game);
                    showGameOver();
                    return;
                }
                // End turn after drawing (basic rules)
                setTimeout(() => finishTurn(), 400);
            }
        };

        console.log('♠ Abluxxen geladen! Viel Spaß!');
    </script>
